# Template to copy into a repository (e.g. my_project_website/website_settings.yml) and adapt.
site_name: My project
site_description: One sentence describing the project
# Production address (sitemap, canonical links, 404 page)
site_url: https://openflexo.org/my_project/docs/

theme:
  logo: images/logo.png

# Menu order and sections; page titles come from each page's H1
nav:
  - index.md
  - getting_started.md
  - Section name:
    - my-module/index.md

extra:
  # Folders copied into the website, relative to this file. A later entry overwrites an earlier one.
  documentation_sources:
    - source: ../src/site/markdown
      destination: .
    - source: ../my-module/src/site/markdown
      destination: my-module
    - source: ../src/site/resources/images
      destination: images
  homepage: https://openflexo.org/my_project/
  # Versions already published elsewhere, listed in the version menu after the current one
  previous_versions:
    - name: "1.0"
      link: https://openflexo.org/my_project/docs/1.0/
  # Other Openflexo websites (same domain) whose pages the search box also finds
  global_search:
    - name: Other project
      site_url: https://openflexo.org/other_project/docs/
  navbar_links:
    - title: Home
      link: https://openflexo.org/
    - title: Documentation
      is_current_site: true
