{# Lists the versions read from versions.json, which sits at the root of the displayed version #}
<details class="site-version-menu" data-versions-url="{{ 'versions.json' | url }}">
  <summary>{{ config.extra.displayed_version }}</summary>
  <ul class="site-version-menu__list"></ul>
</details>
<script>
  (function fillVersionMenu() {
    const versionMenu = document.querySelector(".site-version-menu");
    const versionList = versionMenu.querySelector("ul");
    const displayedVersionRoot = new URL(".", new URL(versionMenu.dataset.versionsUrl, location.href));
    const pagePath = location.pathname.slice(displayedVersionRoot.pathname.length);

    function createVersionItem(version) {
      const versionRoot = new URL(version.link + "/", displayedVersionRoot);
      const versionLink = document.createElement("a");
      versionLink.href = versionRoot;
      versionLink.textContent = version.name;
      const samePageInVersion = new URL(pagePath, versionRoot);
      fetch(samePageInVersion, { method: "HEAD" })
        .then((response) => { if (response.ok) versionLink.href = samePageInVersion; })
        .catch(() => {});
      const versionItem = document.createElement("li");
      versionItem.classList.toggle("site-version-menu__current", Boolean(version.current));
      versionItem.append(versionLink);
      return versionItem;
    }

    fetch(versionMenu.dataset.versionsUrl)
      .then((response) => response.json())
      .then((versions) => versions.forEach((version) => versionList.append(createVersionItem(version))))
      .catch(() => versionMenu.classList.add("site-version-menu--unavailable"));
  })();
</script>
