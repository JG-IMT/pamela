{# Dark footer: link columns, then the copyright line #}
<div class="site-footer">
  <div class="site-footer__columns">
    {% for footer_column in config.extra.footer_columns %}
      <div class="site-footer__column">
        <p class="site-footer__title">{{ footer_column.title }}</p>
        <ul class="site-footer__links">
          {% for footer_link in footer_column.links %}
            <li class="site-footer__item"><a href="{{ footer_link.link }}">{{ footer_link.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    {% endfor %}
  </div>
  <p class="site-footer__copyright">{{ config.copyright }}</p>
</div>
